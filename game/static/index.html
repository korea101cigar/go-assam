<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Snake · 单词贪吃蛇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🐍</span>
        <h1>Word Snake</h1>
      </div>
      <p class="tagline">吃掉英文单词，集齐 8 个，收获一首诗</p>
    </header>

    <main class="main">
      <section class="board-section">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="576" height="432"></canvas>
          <div id="overlay" class="overlay hidden">
            <p id="overlayText" class="overlay-text"></p>
          </div>
        </div>
        <div class="score-bar">
          <div class="score-item">
            <span class="label">分数</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="score-item">
            <span class="label">长度</span>
            <span id="length" class="value">3</span>
          </div>
          <div class="score-item">
            <span class="label">单词</span>
            <span id="wordCount" class="value">0 / 8</span>
          </div>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h2>速度</h2>
          <p class="hint">选择 1（慢）到 10（快）</p>
          <div id="speedButtons" class="speed-grid"></div>
          <p class="speed-display">当前：<strong id="speedLabel">5</strong></p>
        </div>

        <div class="panel actions">
          <button id="btnStart" class="btn btn-primary">开始游戏</button>
          <button id="btnRestart" class="btn btn-secondary" disabled>重新开始</button>
        </div>

        <div class="panel">
          <h2>单词收集盒</h2>
          <div id="wordBox" class="word-box">
            <p class="word-box-empty">还没有收集到单词</p>
          </div>
        </div>

        <div id="poemPanel" class="panel poem-panel hidden">
          <h2>✨ 你的诗</h2>
          <pre id="poemText" class="poem-text"></pre>
        </div>
      </aside>
    </main>

    <footer class="footer">
      <span>方向键控制移动</span>
      <span>·</span>
      <span>撞墙或撞到自己则游戏结束</span>
    </footer>
  </div>

  <script src="js/words.js"></script>
  <script src="js/poet.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
